<meta charset="utf-8">
<title>Block World</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Sarabun:wght@400;600;700&display=swap">
<style>
/* Layout: แถบหัว (มาตรวัด + สิ่งมหัศจรรย์) · กระดาน 11×9 ทางซ้าย · แผงผู้เล่นทางขวา · หน้าต่างภารกิจลอยกลางจอ */
:root{
  --paper:#fbf6ea;--raised:#ffffff;--ink:#2a2233;--muted:#5f566b;--line:#d9cfb8;
  --subj:#c8322b;--verb:#f2b705;--obj:#1d4a9e;--mod:#4f74b8;--on-dark:#ffffff;--on-light:#2a2233;
  --t-statement:#2e7d4f;--t-negative:#5b4b8a;--t-question:#b4541a;--t-command:#1f2a44;--t-request:#b03a72;
  --chaos:#4a2a5e;--gold:#e8a33d;--teal:#17767a;--sky:#dcebf7;--focus:#1d4a9e;--good:#2e7d4f;--bad:#b4341a;
  --shadow:0 2px 0 #d9cfb8;--scrim:rgba(42,34,51,.55);
  --water:#a8e6df;--wave:#7fd6cc;--grass:#d4ec9f;--grass-edge:#8fbf4f;--sand:#f3dfb0;--sand-edge:#d2a862;
  --display:Mitr,"Noto Sans Thai",system-ui,sans-serif;--body:Sarabun,"Noto Sans Thai",system-ui,sans-serif;
  --emoji:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1b1a24;--raised:#262433;--ink:#f4efe3;--muted:#b8b0c4;--line:#3d3a4d;--subj:#d23d34;--obj:#3a6fc9;--mod:#5d82c6;
  --t-negative:#6a5a9c;--t-command:#4a5a85;--chaos:#7a4a96;--teal:#1f8a8e;--sky:#24364a;--focus:#8aa0d6;--good:#4caf78;--bad:#e0714f;
  --shadow:0 2px 0 #0e0d14;--scrim:rgba(0,0,0,.6);color-scheme:dark;
  --water:#0f3a3a;--wave:#155050;--grass:#34502a;--grass-edge:#1f3318;--sand:#4a3c25;--sand-edge:#2e2516}}
:root[data-theme="dark"]{
  --paper:#1b1a24;--raised:#262433;--ink:#f4efe3;--muted:#b8b0c4;--line:#3d3a4d;--subj:#d23d34;--obj:#3a6fc9;--mod:#5d82c6;
  --t-negative:#6a5a9c;--t-command:#4a5a85;--chaos:#7a4a96;--teal:#1f8a8e;--sky:#24364a;--focus:#8aa0d6;--good:#4caf78;--bad:#e0714f;
  --shadow:0 2px 0 #0e0d14;--scrim:rgba(0,0,0,.6);color-scheme:dark;
  --water:#0f3a3a;--wave:#155050;--grass:#34502a;--grass-edge:#1f3318;--sand:#4a3c25;--sand-edge:#2e2516}
*{box-sizing:border-box}
html,body{height:100%}
body{background-color:var(--water);background-image:radial-gradient(ellipse 34px 8px at 50% 100%,transparent 70%,var(--wave) 72%,var(--wave) 84%,transparent 86%);background-size:96px 48px;color:var(--ink);font:16px/1.55 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:500;margin:0;text-wrap:balance;line-height:1.25}
button{font:500 15px/1.2 var(--display);color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.emoji{font-family:var(--emoji)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:999px;background:var(--raised);border:2px solid var(--line);min-height:44px}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.gold{background:var(--gold);color:var(--on-light);border-color:var(--gold)}
.btn.teal{background:var(--teal);color:#fff;border-color:var(--teal)}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.wrap{max-width:1360px;margin:0 auto;padding-block:12px 32px;display:flex;flex-direction:column;gap:12px}
/* หัว */
.top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:22px}
.brand .blk{display:flex}
.brand .blk i{width:22px;height:14px;display:block}
.meter{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.meter .lab{font:500 13px var(--display);color:var(--muted)}
.pips{display:flex;gap:3px}
.pip{width:20px;height:24px;border-radius:5px;border:1.5px solid var(--line);background:var(--raised);font:600 11px/21px var(--display);text-align:center;color:var(--muted)}
.pip.atk{border-color:var(--chaos);color:var(--chaos)}
.pip.on{background:var(--chaos);border-color:var(--chaos);color:#fff}
.wonders{display:flex;gap:6px}
.won{display:flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;border:2px solid var(--teal);font:500 13px var(--display)}
.won b{font-weight:600;color:var(--teal)}
.won.done{background:var(--teal);color:#fff}.won.done b{color:#fff}
.menu{display:flex;gap:6px;flex-wrap:wrap}
/* พื้นที่หลัก */
.main{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,1fr);gap:16px;align-items:start}
@media (max-width:980px){.main{grid-template-columns:minmax(0,1fr)}}
.board{position:relative;display:grid;grid-template-columns:repeat(11,1fr);grid-template-rows:repeat(9,1fr);gap:4px;aspect-ratio:11/9;width:100%;max-width:100%;background:#f6e6bf;border:2px solid var(--sand-edge);border-radius:18px;padding:8px;box-shadow:0 6px 0 var(--sand-edge)}
.cell{position:relative;border-radius:8px;background:var(--grass);border:1.5px solid var(--grass-edge);box-shadow:0 3px 0 var(--grass-edge);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;padding:2px;min-width:0}
.cell .ic{font-size:clamp(14px,2.4vw,28px);line-height:1}
.cell .ic.t{font-family:var(--display);font-weight:600}
.cell .nm{font:500 clamp(8px,.85vw,11px)/1.1 var(--display);text-align:center;margin-top:2px}
@media (max-width:640px){.cell .nm{display:none}}
.cell.creative{background:var(--gold);border-color:var(--gold);color:var(--on-light)}
.cell.coop{background:var(--teal);border-color:var(--teal);color:#fff}
.cell.challenge{background:var(--t-command);border-color:var(--t-command);color:#fff}
.cell.chaos{background:var(--chaos);border-color:var(--chaos);color:#fff}
.cell.hint{background:var(--sky);border-color:#8fb4d6;box-shadow:0 3px 0 #8fb4d6}
.cell.creative,.cell.coop,.cell.challenge,.cell.chaos{box-shadow:0 3px 0 rgba(0,0,0,.35)}
.cell.corner:not(.challenge):not(.chaos){background:var(--raised);border-color:var(--sand-edge);box-shadow:0 3px 0 var(--sand-edge)}
.cell.market{border-color:var(--verb);border-width:2.5px;box-shadow:0 3px 0 #c99a06}
.cell.corner{border-width:2.5px}
.cell .no{position:absolute;top:1px;right:4px;font-size:9px;opacity:.7}
.cell .vb{position:absolute;top:1px;left:3px;background:var(--verb);color:var(--on-light);border-radius:5px;padding:0 4px;font:500 clamp(7px,.8vw,10px)/1.4 var(--display)}
@media (max-width:640px){.cell .vb{display:none}}
.rolldie{min-width:78px;height:78px;padding:0 8px;border-radius:14px;border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font:600 20px/1.1 var(--display);text-align:center}
.artboard{position:relative;width:100%;aspect-ratio:1448/1086;container-type:inline-size;border-radius:14px;overflow:hidden;background:#fff}
.artboard img{position:absolute;inset:0;width:100%;height:100%;display:block}
.artboard .fix{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:4px;font-family:var(--display);font-weight:600;line-height:1.12;white-space:pre-line;pointer-events:none}
.artboard .hot{position:absolute;border-radius:14px;background:transparent;border:2px solid transparent}
.artboard .hot:hover,.artboard .hot:focus-visible{border-color:#fff;background:rgba(255,255,255,.18);box-shadow:0 0 0 3px var(--focus)}
.spc{position:absolute;transform:translate(-50%,-50%);width:3.3cqw;height:3.3cqw;min-width:15px;min-height:15px;border-radius:50%;border:max(2px,.28cqw) solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;background:#fff;color:var(--on-light);z-index:2}
.spc .ic{font-size:max(9px,1.7cqw);line-height:1}
.spc .ic.t{font-family:var(--display);font-weight:600}
.spc .no{position:absolute;bottom:-1.25cqw;left:50%;transform:translateX(-50%);background:#2a2233;color:#fff;border-radius:6px;padding:0 4px;font:600 max(8px,.85cqw)/1.35 var(--display)}
.spc .vb{position:absolute;top:-1.5cqw;left:50%;transform:translateX(-50%);background:var(--verb);color:var(--on-light);border-radius:5px;padding:0 4px;font:600 max(8px,.8cqw)/1.35 var(--display);white-space:nowrap}
.spc .pawns{position:absolute;bottom:auto;top:-2.6cqw;left:50%;right:auto;transform:translateX(-50%);display:flex;gap:1px;flex-wrap:nowrap}
.k-wood{background:#5fae3a;color:#fff}.k-brick{background:#d8483a;color:#fff}.k-stone{background:#3c78d0;color:#fff}.k-glass{background:#f2b705}
.k-challenge,.k-observatory{background:#1f2a44;color:#fff}.k-creative{background:#e8a33d}.k-market,.k-bigmarket{background:#fff3c4}
.k-coop{background:#17767a;color:#fff}.k-hint{background:#dcebf7}.k-storm,.k-cave{background:#4a2a5e;color:#fff}
.turncard,.below2{display:flex;flex-direction:column;gap:8px;background:var(--raised);border:1.5px solid var(--sand-edge);border-radius:14px;padding:10px 12px}
.turncard .turnline{flex-wrap:wrap}
.turncard .tower{width:auto;margin-left:auto}
.below2 .log{max-height:150px}
@media (max-width:700px){.turncard .tower{display:none}}
.tower{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tower .tn{font:500 13px var(--display);color:var(--muted);width:100%}
.tb{display:inline-flex;align-items:center;gap:2px;padding:2px 9px;border-radius:999px;border:2px solid var(--bc);background:color-mix(in srgb,var(--bc) 14%,var(--raised));font:500 13px var(--display)}

.zones{display:flex;flex-wrap:wrap;gap:6px}
.zone{display:inline-flex;align-items:center;gap:4px;padding:3px 12px;border-radius:10px;background:var(--zc);color:#fff;font:500 14px var(--display)}
.zone small{opacity:.85;font-size:12px}
.village{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:var(--grass);border:2px solid var(--grass-edge);border-radius:16px;padding:10px 8px;box-shadow:0 0 0 5px var(--sand),0 7px 0 5px var(--sand-edge);margin:6px 5px 12px}
.vil{display:flex;flex-direction:column;align-items:center;gap:0;min-width:0}
.vil .roof{width:0;height:0;border-left:24px solid transparent;border-right:24px solid transparent;border-bottom:16px solid var(--vc)}
.vil .house{width:40px;height:28px;background:var(--raised);border:2px solid #8a5a2b;border-top:0;display:flex;align-items:center;justify-content:center;font-size:18px}
.vil .lab{margin-top:4px;background:var(--vc);color:#fff;border-radius:7px;padding:2px 6px;font:500 12px/1.2 var(--display);text-align:center}
.vil:hover .house,.vil:focus-visible .house{transform:translateY(-2px)}
@media (max-width:640px){.village{grid-template-columns:repeat(4,1fr)}}
.picker{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px 44px}
.pk{width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:var(--raised);font-size:22px;display:flex;align-items:center;justify-content:center}
.pk.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--gold)}
.pk:disabled{opacity:.3}
.mmap{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.mmb{border:2px solid var(--bc);border-left-width:8px;border-radius:10px;padding:8px 10px;font-size:14px}
.mmb b{color:var(--bc);font-family:var(--display);font-weight:500;font-size:15px}
.mmb ul{margin:4px 0;padding-left:18px}
.rolldie small{font:400 12px var(--body);opacity:.9}
.pawns{position:absolute;bottom:2px;left:2px;right:2px;display:flex;flex-wrap:wrap;gap:1px;justify-content:center}
.pawn{width:clamp(14px,1.9vw,22px);height:clamp(14px,1.9vw,22px);border-radius:50%;border:2px solid #fff;font-size:clamp(9px,1.1vw,13px);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.35);transition:transform .2s}
.pawn.cur{transform:scale(1.25);z-index:2}
.center{grid-column:2/11;grid-row:2/9;border-radius:14px;background:var(--raised);border:1.5px solid var(--sand-edge);box-shadow:0 0 0 6px var(--water),0 0 0 8px var(--sand-edge);margin:8px;padding:clamp(8px,1.5vw,18px);display:flex;flex-direction:column;gap:10px;min-width:0;overflow:hidden}
.turnline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.turnline h2{font-size:clamp(16px,2vw,22px)}
.die{width:clamp(44px,6vw,64px);height:clamp(44px,6vw,64px);border-radius:14px;background:var(--paper);border:2px solid var(--line);font:600 clamp(22px,3.4vw,34px)/1 var(--display);display:flex;align-items:center;justify-content:center}
.die.roll{animation:shake .5s}
@keyframes shake{20%{transform:rotate(-14deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(6deg)}}
@media (prefers-reduced-motion:reduce){.die.roll{animation:none}.pawn{transition:none}}
.log{flex:1;min-height:0;overflow:auto;font-size:14px;line-height:1.45;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.log div:first-child{color:var(--ink);font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.boardwrap{display:flex;flex-direction:column;gap:10px;min-width:0}
.below{display:none;flex-direction:column;gap:10px;background:var(--raised);border:1.5px solid var(--line);border-radius:14px;padding:12px}
.below .log{max-height:150px}
@media (max-width:700px){.center .acts,.center .log{display:none}.below{display:flex}.center{padding:6px;gap:4px;justify-content:center}.turnline{gap:6px}}
/* แผงผู้เล่น */
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{display:flex;align-items:center;gap:6px;padding:6px 12px 6px 6px;border-radius:999px;border:2px solid var(--line);background:var(--raised);font:500 14px var(--display)}
.tab .dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px}
.tab.cur{border-color:var(--ink)}
.tab.sel{background:var(--ink);color:var(--paper)}
.tab small{font:400 12px var(--body);opacity:.8}
.panel{background:var(--raised);border:1.5px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h3{font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel h3 small{font:400 13px var(--body);color:var(--muted)}
.res{display:flex;flex-wrap:wrap;gap:6px}
.cell.res{flex-wrap:nowrap;gap:0}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;background:var(--paper);border:1.5px solid var(--line);font:500 14px var(--display);font-variant-numeric:tabular-nums}
.chip.btnish{cursor:pointer}
.chip .g{width:12px;height:12px;border-radius:50%}
.hand{display:flex;flex-wrap:wrap;gap:4px}
/* บล็อกคำ */
.tile{position:relative;display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 20px 0 14px;font:500 17px/1.1 var(--display);white-space:nowrap;cursor:pointer;user-select:none;border:0}
.tile.S{background:var(--subj);color:var(--on-dark);clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%);border-radius:8px 0 0 8px}
.tile.V{background:var(--verb);color:var(--on-light);clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%,10px 50%);padding-left:20px}
.tile.O{background:var(--obj);color:var(--on-dark);clip-path:polygon(0 0,100% 0,100% 100%,0 100%,10px 50%);border-radius:0 8px 8px 0;padding-left:20px;padding-right:14px}
.tile.M{background:var(--mod);color:var(--on-dark);clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%,10px 50%);padding-left:20px}
.tile.C{background:var(--raised);color:var(--ink);border:2px solid var(--line);border-top:6px solid var(--tc,var(--muted));border-radius:8px;padding:0 12px}
.tile.G{background:transparent;color:var(--subj);border:2.5px dashed var(--subj);border-radius:8px;padding:0 12px}
.tile small{font-size:10px;position:absolute;top:2px;left:6px;opacity:.85}
.tile.sm{min-height:32px;font-size:14px;padding:0 16px 0 12px}
.tile.sm.V,.tile.sm.O,.tile.sm.M{padding-left:16px}
.tile.sm.C,.tile.sm.G{padding:0 9px}
.tile[aria-disabled="true"]{opacity:.35;cursor:default}
/* เมือง */
.city{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
@media (max-width:520px){.city{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dist{border-radius:10px;border:1.5px solid var(--line);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.dist .dh{color:#fff;padding:5px 7px;font:500 12px/1.2 var(--display)}
.plot{border-top:1px dashed var(--line);padding:6px 7px;font-size:12px;line-height:1.35;min-height:62px;display:flex;flex-direction:column;gap:3px}
.plot .lv{font:500 12px var(--display)}
.plot.broken{background:color-mix(in srgb,var(--chaos) 14%,transparent)}
.plot .empty{color:var(--muted)}
.plot button{align-self:flex-start;font-size:12px;padding:2px 8px;border-radius:999px;border:1.5px solid var(--chaos);color:var(--ink)}
/* หน้าต่าง */
.scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));overflow:auto;z-index:50}
.modal{background:var(--paper);border-radius:18px;max-width:760px;width:100%;margin:auto 0;box-shadow:0 12px 40px rgba(0,0,0,.3);overflow:hidden;display:flex;flex-direction:column}
.mhead{padding:14px 18px;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px}
.mhead h2{font-size:20px}
.mhead .x{color:inherit;font-size:22px;width:40px;height:40px;border-radius:50%}
.mbody{padding:16px 18px 20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.sign{border:2.5px solid var(--chaos);border-radius:12px;background:color-mix(in srgb,var(--chaos) 10%,var(--raised));color:var(--ink);font:500 20px/1.4 var(--display);text-align:center;padding:12px}
.task{font-size:17px;line-height:1.6}
.dockbox{border-radius:14px;border:2px dashed var(--line);background:var(--raised);padding:12px;display:flex;flex-direction:column;gap:10px}
.dockrow{display:flex;flex-wrap:wrap;align-items:center;gap:0;min-height:52px;padding:4px;border-radius:10px;background:var(--paper)}
.dockrow .tile{margin-right:-6px}
.dockrow .ph{color:var(--muted);font-size:14px;padding:0 8px}
.tray{display:flex;flex-wrap:wrap;gap:6px}
.flags{display:flex;flex-wrap:wrap;gap:6px}
.flag{padding:8px 12px;border-radius:0 8px 8px 0;color:#fff;font:500 15px var(--display);border-left:4px solid var(--muted);opacity:.55;min-height:40px}
.flag.on{opacity:1;outline:3px solid var(--ink);outline-offset:2px}
.owl{display:flex;gap:12px;align-items:flex-start;background:var(--sky);border-radius:14px;padding:12px 14px}
.owl .o{font-size:34px;line-height:1}
.owl p{margin:0;font-size:16px}
.owl b{font-family:var(--display);font-weight:500}
.feedback{font:500 16px var(--display);padding:10px 14px;border-radius:12px}
.feedback.ok{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--ink)}
.feedback.no{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.card{background:var(--raised);border:1.5px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h3{font-size:16px}
.card h3 small{font:400 13px var(--body);color:var(--muted);margin-left:8px}
.muted{color:var(--muted)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);font-size:18px}
.stepper span{min-width:28px;text-align:center;font:600 18px var(--display);font-variant-numeric:tabular-nums}
label.ck{display:flex;gap:8px;align-items:flex-start;font-size:15px;cursor:pointer}
label.ck input{width:20px;height:20px;margin-top:2px;flex:none}
textarea{width:100%;min-height:88px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font:16px/1.5 var(--body);padding:8px 10px}
input[type=text]{border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font:16px var(--body);padding:8px 10px;min-height:42px;width:100%}
.cubes{display:flex;flex-wrap:wrap;gap:8px}
.cube{width:72px;height:80px;border-radius:12px;background:var(--raised);border:2px solid var(--line);border-top:8px solid var(--cc);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:var(--shadow)}
.cube .e{font-size:34px;line-height:1}
.cube small{font:500 11px/1.1 var(--display);color:var(--muted);text-align:center;padding:0 3px}
.cube.spin{animation:shake .5s}
@media (prefers-reduced-motion:reduce){.cube.spin{animation:none}}
.timer{font:600 30px var(--display);font-variant-numeric:tabular-nums}
.chunkdots{display:flex;gap:6px}
.chunkdots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.chunkdots i.on{background:var(--ink)}
.house{display:flex;align-items:flex-end;justify-content:center;gap:0;padding:10px 0}
.house .tile{animation:slide .6s both}
.house .tile:nth-child(2){animation-delay:.25s}.house .tile:nth-child(3){animation-delay:.5s}.house .tile:nth-child(4){animation-delay:.75s}
@keyframes slide{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.house .tile{animation:none}}
table.score{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.score th,table.score td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:right}
table.score th:first-child,table.score td:first-child{text-align:left}
.tablewrap{overflow-x:auto}
.setup{max-width:720px;margin:0 auto;padding-block:24px 40px;display:flex;flex-direction:column;gap:18px}
.hero{display:flex;flex-direction:column;gap:10px}
.hero h1{font-size:clamp(30px,6vw,46px);font-weight:600}
.hero p{font-size:17px;color:var(--muted);margin:0;max-width:60ch}
.hero .blocks{display:flex;margin-top:6px}
.prow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center}
.prow .dot{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{padding:8px 18px;min-height:42px}
.seg button.on{background:var(--ink);color:var(--paper)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font:500 15px var(--display);z-index:80;max-width:calc(100% - 32px);text-align:center}
</style>

<script>

const $ = (s, el = document) => el.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
}
const rnd = (n) => Math.floor(Math.random() * n);
const pick = (a) => a[rnd(a.length)];
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const TYPE = Object.fromEntries(DATA.TYPES.map((t) => [t.id, t]));
const TCOL = (id) => `var(--t-${id})`;
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
function toast(msg) {
  const t = h('div', { class: 'toast', role: 'status' }, msg);
  document.body.append(t); setTimeout(() => t.remove(), 2600);
}

// ====================== บล็อกคำและไวยากรณ์ ======================
const CHANGER_INFO = Object.fromEntries(DATA.CHANGERS.map(([w, type, where]) => [w, { type, where }]));

// อักษรแทนคำเปลี่ยนร่างในตัวตรวจไวยากรณ์
const CLETTER = { 'ไม่': 'N', 'ไม่ได้': 'N', 'มิได้': 'N', 'ไหม': 'Q', 'ที่ไหน': 'Q', 'เมื่อไร': 'Q', 'ใคร': 'W', 'อะไร': 'A', 'จง': 'K', 'ห้าม': 'K', 'อย่า': 'K', 'ช่วย': 'R', 'โปรด': 'R', 'กรุณา': 'R', 'หน่อย': 'H' };
let uid = 1;
function tile(spec) {
  const [r, w] = spec.split(':');
  return { id: uid++, r, w };
}
const tileType = (t) => (t.r === 'C' ? (CHANGER_INFO[t.w] || {}).type : null);
const PATTERNS = [
  ['statement', /^SM*VM*(OM*)?$/],
  ['negative', /^SM*NVM*(OM*)?$/],
  ['question', /^SM*N?VM*(OM*)?QM*$/],
  ['question', /^WVM*(OM*)?$/],
  ['question', /^SM*VM*AM*$/],
  ['command', /^[SG]?KVM*(OM*)?$/],
  ['command', /^K[SG]M*VM*(OM*)?$/],
  ['command', /^GVM*(OM*)?$/],
  ['command', /^VM*(OM*)?$/],
  ['request', /^[SG]?RVM*(OM*)?H?$/],
  ['request', /^[SG]?VM*(OM*)?H$/],
];
function lettersOf(tiles) { return tiles.map((t) => (t.r === 'C' ? CLETTER[t.w] || '?' : t.r)).join(''); }
function parse(tiles) {
  const s = lettersOf(tiles);
  for (const [type, re] of PATTERNS) {
    if (re.test(s)) {
      const hasObj = /[OA]/.test(s);
      const mods = (s.match(/M/g) || []).length;
      const level = !hasObj ? 1 : mods >= 2 ? 3 : 2;
      return { ok: true, type, level, s };
    }
  }

function diagnose(s) {
  if (!s) return 'บล็อกเรียงสลับ';

  if (/N/.test(s) && !/N V|NV/.test(s.replace(/M/g, ''))) return 'ปฏิเสธผิดที่';
  if (/Q/.test(s) && !/Q[M]*$/.test(s)) return 'คำถามไม่มีคำแสดงคำถาม';
  if (!/[SGWKR]/.test(s)) return 'ขาดประธาน';

    if (!r) { const x = Math.random(); r = x < .3 ? 'S' : x < .58 ? 'V' : x < .8 ? 'O' : x < .9 ? 'M' : x < .985 ? 'C' : 'G'; }

      if (p.type !== dm.rule.type) return { ok: false, issue: 'ปักธงผิด' };

  if (!flag) return { ok: false, issue: 'ปักธงผิด', msg: 'ยังไม่ได้ปักธงประเภทประโยค' };
  if (flag !== dm.flag) return { ok: false, issue: 'ปักธงผิด', msg: 'ประโยคถูกแล้ว แต่ธงยังไม่ตรงกับคำสังเกต' };

}
function missingIssue(dock, dm) {
  const need = new Set((dm.answers || [[]])[0]);
  const roles = dm.tiles.filter((x) => need.has(x.split(':')[1])).map((x) => x[0]);
  const have = dock.map((t) => t.r);
  if (roles.includes('S') && !have.includes('S')) return 'ขาดประธาน';
  if (roles.includes('V') && !have.includes('V')) return 'ขาดกริยา';
  if (roles.includes('O') && !have.includes('O')) return 'ขาดกรรม';
  if (have.length > need.size) return 'บล็อกเรียงสลับ';
  return 'บล็อกเรียงสลับ';
}

}
function reward(level, flag, ctx) {

  if (level === 1) { const k = p.res.wood <= p.res.brick ? 'wood' : 'brick'; p.res[k]++; p.hand.push(...draw()); log(`${p.name} ได้${k === 'wood' ? 'ไม้' : 'อิฐ'} 1 และบล็อกคำ 1`); }
  if (level >= 2) {

  }

}

// ====================== จบเกมและนับแต้ม ======================
function score(p) {
  let bld = 0; let districts = 0;
  for (const t of DATA.TYPES) { const arr = p.city[t.id]; if (arr.some(Boolean)) districts++; for (const b of arr) if (b && !b.broken) bld += DATA.COST[b.level - 1].points; }
  const stars = p.stars.reduce((a, b) => a + b, 0);
  const crFull = Object.values(p.crPass).filter((n) => n >= 3).length * 2;
  const all5 = districts === 5 ? 3 : 0;
  const total = bld + stars + crFull + p.res.helper + p.wonderPts + all5 + (p.story || 0);
  return { bld, stars, crFull, helper: p.res.helper, wonder: p.wonderPts, all5, story: p.story || 0, total };
}
function confirmEnd() {
  openModal({ title: 'จบเกมตอนนี้?', color: 'var(--ink)', onClose: render,
    body: [h('p', { class: 'task', style: 'margin:0' }, 'เมื่อหมดคาบ กดจบเกมเพื่อเล่านิทานเมืองของฉันและนับแต้ม'), h('div', { class: 'row' }, h('button', { class: 'btn primary', type: 'button', onclick: () => { S.ended = 'end'; closeModal(); openEnd(); } }, 'จบเกมและนับแต้ม'), h('button', { class: 'btn', type: 'button', onclick: () => { closeModal(); render(); } }, 'เล่นต่อ'))] });
}
function openEnd() {
  if (S.ended === 'lose' && !S.storyDone) {
    openModal({ title: 'ยุ่งเหยิงยึดเมืองได้!', color: 'var(--chaos)', closable: false,
      body: [h('div', { style: 'font-size:60px;text-align:center', class: 'emoji' }, '👾'), h('p', { class: 'task', style: 'margin:0' }, 'มาตรวัดความสับสนถึง 12 ทุกคนแพ้พร้อมกัน แต่เมืองที่สร้างไว้ยังอยู่ ลองเล่านิทานเมืองของตัวเองแล้วดูแต้มกัน ครั้งหน้าลองช่วยกันสร้างสิ่งมหัศจรรย์ให้เร็วขึ้นนะ'),
        h('button', { class: 'btn primary', type: 'button', onclick: storyPhase }, 'เล่านิทานเมืองของฉัน')] });
    return;
  }
  if (!S.storyDone) return storyPhase();
  showScores();
}
function storyPhase() {
  const crit = ['เรื่องต่อเนื่อง', 'มีประโยคหลากประเภท', 'น่าตื่นเต้น'];

      h('div', { class: 'grid2' }, S.players.map((p, i) => h('div', { class: 'card' }, h('h3', {}, h('span', { class: 'emoji' }, p.animal), ' ', p.name),

}
function showScores() {
  const rows = S.players.map((p) => ({ p, s: score(p) })).sort((a, b) => b.s.total - a.s.total || b.s.helper - a.s.helper);

        h('tbody', {}, rows.map(({ p, s }) => h('tr', {}, h('td', {}, `${p.animal} ${p.name}`), [s.bld, s.stars, s.crFull, s.helper, s.wonder, s.all5, s.story].map((v) => h('td', {}, v)), h('td', {}, h('b', {}, s.total))))))),
      owlEl('คำถามชวนคิดก่อนแยกย้าย: ประโยคไหนซ่อมยากที่สุด เพราะอะไร? และเรารู้ได้อย่างไรว่าประโยคเป็นประเภทไหน?'),
      h('div', { class: 'row' }, h('button', { class: 'btn primary', type: 'button', onclick: () => { store.del(SAVE_KEY); S = null; closeModal(); renderSetup(); } }, 'เริ่มเกมใหม่'),
        h('button', { class: 'btn', type: 'button', onclick: () => { closeModal(); ui.view = 'review'; S.ended = S.ended || 'end'; renderReview(); } }, 'ดูเมืองของทุกคน'))] });
}
function renderReview() {
